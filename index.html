<script>
window.STATIC_STATE = {"courses": [{"name": "Course 1", "csv_filename": "Louis-11k", "active": true, "started": true, "elapsed": 13718.932827949524, "results": [{"rank": 1, "dossard": "101", "nom": "HUSSON", "prenom": "Laetitia", "sexe": "F", "categorie": "M1", "club": "", "temps": "00:00:06.626", "timestamp": "2026-10-25T15:00:35.551"}, {"rank": 2, "dossard": "102", "nom": "GOÛT", "prenom": "Johann", "sexe": "M", "categorie": "M2", "club": "SENS ROUTE TRAIL", "temps": "00:00:11.773", "timestamp": "2026-10-25T15:00:40.698"}, {"rank": 3, "dossard": "103", "nom": "CHEVALIER", "prenom": "Gary", "sexe": "M", "categorie": "Senior", "club": "", "temps": "00:00:15.124", "timestamp": "2026-10-25T15:00:44.048"}, {"rank": 4, "dossard": "104", "nom": "MORLAY", "prenom": "Anaïs", "sexe": "F", "categorie": "M1", "club": "", "temps": "00:00:17.745", "timestamp": "2026-10-25T15:00:46.670"}, {"rank": 5, "dossard": "201", "nom": "BRIDERON", "prenom": "Virginie", "sexe": "F", "categorie": "M1", "club": "Gati'Raid", "temps": "00:00:20.148", "timestamp": "2026-10-25T15:00:49.073"}, {"rank": 6, "dossard": "230", "nom": "LAMI", "prenom": "Gregory", "sexe": "M", "categorie": "M1", "club": "", "temps": "00:00:22.536", "timestamp": "2026-10-25T15:00:51.461"}, {"rank": 7, "dossard": "105", "nom": "LORILLON", "prenom": "Sebastien", "sexe": "M", "categorie": "M3", "club": "", "temps": "02:52:29.037", "timestamp": "2026-10-25T17:52:57.962"}, {"rank": 8, "dossard": "108", "nom": "POLI", "prenom": "Yann", "sexe": "M", "categorie": "M1", "club": "", "temps": "03:22:04.902", "timestamp": "2026-10-25T18:22:33.827"}, {"rank": 9, "dossard": "113", "nom": "L'HOTELLIER", "prenom": "Guillaume", "sexe": "M", "categorie": "M1", "club": "", "temps": "03:27:25.232", "timestamp": "2026-10-25T18:27:54.158"}]}, {"name": "Course 2", "csv_filename": "Villersoise-20k", "active": true, "started": true, "elapsed": 13715.875301837921, "results": [{"rank": 1, "dossard": "302", "nom": "BRIGOLLE", "prenom": "Axel", "sex om": "YVON", "prenom": "Pauline", "sexe": "F", "categorie": "M0", "club": "Srt", "temps": "00:00:59.035", "timestamp": "2026-10-25T15:01:31.017"}]}]};

let selectedCourse = 0;
let selectedGender = 'mixte';
let selectedCategory = 'Toute catégorie';
let currentState = null;
function formatTime(seconds) { if (seconds === null || seconds === undefined) return '--:--:--.---'; let ms=Math.max(0,Math.round(seconds*1000)); let h=Math.floor(ms/3600000);ms%=3600000;let m=Math.floor(ms/60000);ms%=60000;let s=Math.floor(ms/1000);ms%=1000;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(3,'0'); }
function chooseCourse(i){selectedCourse=i;render();}
function chooseGender(g){selectedGender=g;render();}
function chooseCategory(c){selectedCategory=c;render();}
function categoryMatches(a, category){
  if(category==='Toute catégorie') return true;
  return (a.categorie||'').trim().toUpperCase()===category.toUpperCase();
}
function setActiveButtons(){document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));document.getElementById('course'+(selectedCourse+1)).classList.add('active');document.getElementById(selectedGender).classList.add('active');const cat=document.getElementById('cat-'+selectedCategory.replaceAll(' ','-').replaceAll('_','-'));if(cat)cat.classList.add('active');}
function render(){if(!currentState)return;currentState.courses.forEach((c,i)=>{document.getElementById('course'+(i+1)).textContent=c.csv_filename||c.name;});const course=currentState.courses[selectedCourse];document.getElementById('title').textContent=(course.csv_filename||course.name)+' — '+(selectedGender==='mixte'?'Mixte':selectedGender==='homme'?'Homme':'Femme')+' — '+selectedCategory;document.getElementById('chrono').textContent=formatTime(course.elapsed);document.getElementById('status').textContent=course.active?'EN COURS':(course.started?'ARRÊTÉ':'NON DÉMARRÉ');let results=course.results.filter(a=>selectedGender==='mixte'||(selectedGender==='homme'?['M','H','MALE'].includes((a.sexe||'').toUpperCase()):['F','FEM','FEMALE'].includes((a.sexe||'').toUpperCase()))).filter(a=>categoryMatches(a,selectedCategory));document.getElementById('count').textContent=results.length;const tbody=document.getElementById('results');tbody.innerHTML='';results.forEach((a,index)=>{const tr=document.createElement('tr');if(selectedGender==='mixte'&&['F','FEM','FEMALE'].includes((a.sexe||'').toUpperCase()))tr.classList.add('female');[index+1,a.dossard,a.nom,a.prenom,a.sexe,a.categorie,a.club,a.temps].forEach(v=>{const td=document.createElement('td');td.textContent=v??'';tr.appendChild(td);});tbody.appendChild(tr);});setActiveButtons();}
async function refresh(){if(window.STATIC_STATE){currentState=window.STATIC_STATE;render();return;}try{const r=await fetch('/api/state');currentState=await r.json();render();}catch(e){document.getElementById('status').textContent='Connexion perdue';}}refresh();if(!window.STATIC_STATE)setInterval(refresh,500);
</script></body></html>
