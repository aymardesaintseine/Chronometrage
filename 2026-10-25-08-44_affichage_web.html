
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affichage web - Chronométrage</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
h1 { margin-bottom: 12px; }
.controls { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
.control-group { background: white; padding: 10px; border-radius: 6px; }
button { padding: 9px 14px; font-size: 15px; cursor: pointer; margin: 3px; }
button.active { font-weight: bold; outline: 3px solid #555; }
#chrono { font-size: 42px; font-weight: bold; margin: 12px 0 20px; }
.info { margin-bottom: 12px; }
table { border-collapse: collapse; width: 100%; background: white; }
th, td { border: 1px solid #ccc; padding: 7px; text-align: left; }
th { background: #e8e8e8; position: sticky; top: 0; }
.female { background: #ffdede; }
</style>
</head>
<body>
<h1 id="title">Course 1 — Mixte — Toute catégorie</h1>
<div class="controls">
  <div class="control-group"><strong>Course :</strong><br>
    <button id="course1" onclick="chooseCourse(0)">Course 1</button>
    <button id="course2" onclick="chooseCourse(1)">Course 2</button>
  </div>
  <div class="control-group"><strong>Classement :</strong><br>
    <button id="mixte" onclick="chooseGender('mixte')">Mixte</button>
    <button id="homme" onclick="chooseGender('homme')">Homme</button>
    <button id="femme" onclick="chooseGender('femme')">Femme</button>
  </div>
  <div class="control-group"><strong>Catégorie :</strong><br>
    <button id="cat-Toute-catégorie" onclick="chooseCategory('Toute catégorie')">Toute catégorie</button>
    <button id="cat-Junior" onclick="chooseCategory('Junior')">Junior</button>
    <button id="cat-Espoir" onclick="chooseCategory('Espoir')">Espoir</button>
    <button id="cat-Senior" onclick="chooseCategory('Senior')">Senior</button>
    <button id="cat-M0" onclick="chooseCategory('M0')">M0</button>
    <button id="cat-M1" onclick="chooseCategory('M1')">M1</button><button id="cat-M2" onclick="chooseCategory('M2')">M2</button><button id="cat-M3" onclick="chooseCategory('M3')">M3</button><button id="cat-M4" onclick="chooseCategory('M4')">M4</button><button id="cat-M5" onclick="chooseCategory('M5')">M5</button><button id="cat-M6" onclick="chooseCategory('M6')">M6</button><button id="cat-M7" onclick="chooseCategory('M7')">M7</button><button id="cat-M8" onclick="chooseCategory('M8')">M8</button><button id="cat-M9" onclick="chooseCategory('M9')">M9</button><button id="cat-M10" onclick="chooseCategory('M10')">M10</button>
    <br>
    <button id="cat-Cadet-Junior-Espoir" onclick="chooseCategory('Cadet_Junior_Espoir')">Cadet / Junior / Espoir</button>
    <button id="cat-SE-MO" onclick="chooseCategory('SE_MO')">SE / MO</button>
    <button id="cat-M1-M2" onclick="chooseCategory('M1_M2')">M1 / M2</button>
    <button id="cat-M3-M4" onclick="chooseCategory('M3_M4')">M3 / M4</button>
    <button id="cat-M5-et-plus" onclick="chooseCategory('M5_et_plus')">M5 et plus</button>
  </div>
</div>
<div id="chrono">--:--:--.---</div>
<div class="info">Arrivées : <strong id="count">0</strong> &nbsp; | &nbsp; Statut : <strong id="status">---</strong></div>
<table><thead><tr><th>Rang</th><th>Dossard</th><th>Nom</th><th>Prénom</th><th>Sexe</th><th>Catégorie</th><th>Club</th><th>Temps</th></tr></thead>
<tbody id="results"></tbody></table>
<script>
window.STATIC_STATE = {"courses": [{"name": "Course 1", "active": true, "started": true, "elapsed": 1758.1376481056213, "results": [{"rank": 1, "dossard": "121", "nom": "BOGAERT", "prenom": "Rachel", "sexe": "F", "categorie": "SE", "club": "", "temps": "00:00:14.635", "timestamp": "2026-10-25T08:15:24.048"}, {"rank": 2, "dossard": "124", "nom": "BARBEY", "prenom": "Laurent", "sexe": "M", "categorie": "M3", "club": "", "temps": "00:00:16.528", "timestamp": "2026-10-25T08:15:25.941"}, {"rank": 3, "dossard": "125", "nom": "MONNOT", "prenom": "Valentin", "sexe": "M", "categorie": "M0", "club": "AS CHP", "temps": "00:00:22.344", "timestamp": "2026-10-25T08:15:31.758"}, {"rank": 4, "dossard": "126", "nom": "BOUTIN", "prenom": "Nathalie", "sexe": "F", "categorie": "M2", "club": "", "temps": "00:00:25.798", "timestamp": "2026-10-25T08:15:35.212"}]}, {"name": "Course 2", "active": true, "started": true, "elapsed": 1753.9153242111206, "results": [{"rank": 1, "dossard": "301", "nom": "MASUYER", "prenom": "Tristan", "sexe": "M", "categorie": "ES", "club": "", "temps": "00:00:02.107", "timestamp": "2026-10-25T08:15:15.743"}, {"rank": 2, "dossard": "304", "nom": "BOTTINEAU", "prenom": "Jean-sébastien", "sexe": "M", "categorie": "M1", "club": "", "temps": "00:00:07.747", "timestamp": "2026-10-25T08:15:21.383"}, {"rank": 3, "dossard": "302", "nom": "BRIGOLLE", "prenom": "Axel", "sexe": "M", "categorie": "M0", "club": "", "temps": "00:00:27.546", "timestamp": "2026-10-25T08:15:41.182"}, {"rank": 4, "dossard": "306", "nom": "ACKER", "prenom": "Sébastien", "sexe": "M", "categorie": "M0", "club": "", "temps": "00:00:33.826", "timestamp": "2026-10-25T08:15:47.461"}]}]};

let selectedCourse = 0;
let selectedGender = 'mixte';
let selectedCategory = 'Toute catégorie';
let currentState = null;
function formatTime(seconds) { if (seconds === null || seconds === undefined) return '--:--:--.---'; let ms=Math.max(0,Math.round(seconds*1000)); let h=Math.floor(ms/3600000);ms%=3600000;let m=Math.floor(ms/60000);ms%=60000;let s=Math.floor(ms/1000);ms%=1000;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(3,'0'); }
function chooseCourse(i){selectedCourse=i;render();}
function chooseGender(g){selectedGender=g;render();}
function chooseCategory(c){selectedCategory=c;render();}
const categoryGroups={
  'Cadet_Junior_Espoir':['CADET','JUNIOR','ESPOIR'],
  'SE_MO':['SE','MO','SENIOR'],
  'M1_M2':['M1','M2'],
  'M3_M4':['M3','M4'],
  'M5_et_plus':['M5','M6','M7','M8','M9','M10']
};
function categoryMatches(a, category){
  if(category==='Toute catégorie') return true;
  const value=(a.categorie||'').trim().toUpperCase();
  if(categoryGroups[category]) return categoryGroups[category].includes(value);
  return value===category.toUpperCase();
}
function setActiveButtons(){document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));document.getElementById('course'+(selectedCourse+1)).classList.add('active');document.getElementById(selectedGender).classList.add('active');const cat=document.getElementById('cat-'+selectedCategory.replaceAll(' ','-').replaceAll('_','-'));if(cat)cat.classList.add('active');}
function render(){if(!currentState)return;const course=currentState.courses[selectedCourse];document.getElementById('title').textContent=course.name+' — '+(selectedGender==='mixte'?'Mixte':selectedGender==='homme'?'Homme':'Femme')+' — '+selectedCategory;document.getElementById('chrono').textContent=formatTime(course.elapsed);document.getElementById('status').textContent=course.active?'EN COURS':(course.started?'ARRÊTÉ':'NON DÉMARRÉ');let results=course.results.filter(a=>selectedGender==='mixte'||(selectedGender==='homme'?['M','H','MALE'].includes((a.sexe||'').toUpperCase()):['F','FEM','FEMALE'].includes((a.sexe||'').toUpperCase()))).filter(a=>categoryMatches(a,selectedCategory));document.getElementById('count').textContent=results.length;const tbody=document.getElementById('results');tbody.innerHTML='';results.forEach((a,index)=>{const tr=document.createElement('tr');if(selectedGender==='mixte'&&['F','FEM','FEMALE'].includes((a.sexe||'').toUpperCase()))tr.classList.add('female');[index+1,a.dossard,a.nom,a.prenom,a.sexe,a.categorie,a.club,a.temps].forEach(v=>{const td=document.createElement('td');td.textContent=v??'';tr.appendChild(td);});tbody.appendChild(tr);});setActiveButtons();}
async function refresh(){if(window.STATIC_STATE){currentState=window.STATIC_STATE;render();return;}try{const r=await fetch('/api/state');currentState=await r.json();render();}catch(e){document.getElementById('status').textContent='Connexion perdue';}}refresh();if(!window.STATIC_STATE)setInterval(refresh,500);
</script></body></html>
